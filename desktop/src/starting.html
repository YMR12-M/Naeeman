<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
  <title>نعيمًا</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #A9D6C4; color: #143C38;
      font-family: 'Segoe UI', Tahoma, 'Geeza Pro', sans-serif; }
    .box { text-align: center; }
    .sign { display: inline-block; padding: 4px 28px 8px; margin-bottom: 18px; background: #143C38; color: #F3EBDD; border-radius: 3px;
      font-size: 1.8rem; font-weight: 700; outline: 1.5px solid #F3EBDD; outline-offset: -5px; }
    p { margin: 0; font-size: 1.1rem; }
    .dot { display: inline-block; width: 10px; height: 10px; margin: 14px 4px 0; border-radius: 50%; background: #143C38; animation: pulse 1.1s infinite ease-in-out; }
    .dot:nth-child(3) { animation-delay: .18s; } .dot:nth-child(4) { animation-delay: .36s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="sign">نعيمًا</div>
    <p>بنشغّل سيرفر المحل…</p>
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
</body>
</html>
