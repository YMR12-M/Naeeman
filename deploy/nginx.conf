# لوحة المحل وتطبيق الزبون، والاتنين بيوصّلوا /api لسيرفر نعيمًا.
# الـ streams (SSE) محتاجة من غير تخزين مؤقّت ومهلة طويلة.
# (nginx ما عندوش include جوّه نفس الملف، فإعدادات /api مكتوبة في الموقعين.)

upstream naeeman_api { server api:4030; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/panel;

  location /api/ {
    proxy_pass http://naeeman_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/app;

  location /api/ {
    proxy_pass http://naeeman_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  # الـ service worker لازم يتجدّد على طول عشان التحديثات توصل
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
